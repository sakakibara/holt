name: release

# Publish a GitHub Release when a vX.Y.Z tag is pushed. Release notes are the
# matching CHANGELOG.md section, so the changelog stays the single source of
# truth and the tag, build.zig.zon, and changelog cannot drift apart in a
# published release. A tag publishes only when it points at a commit on a
# branch that releases whose push run's ci-ok passed.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: write, actions: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}

      - name: verify the tagged commit landed and passed ci-ok
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          b=$(git branch -r --contains "$GITHUB_SHA" --format='%(refname:lstrip=3)' | grep -Ex 'main|zig-[0-9]+\.[0-9]+|v[0-9]+(\.[0-9]+)?\.x' || true)
          [ -n "$b" ] || { echo "tag is on no branch that releases"; exit 1; }
          id=$(gh run list -R "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" --event push --workflow ci.yml --json databaseId --jq '.[0].databaseId')
          c=$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "ci-ok") | .conclusion')
          [ "$c" = success ] || { echo "ci-ok of the push run: $c"; exit 1; }

      - name: verify version and extract notes
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "tag $tag is not v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          zon_version="$(sed -n 's/^[[:space:]]*\.version = "\(.*\)",/\1/p' build.zig.zon)"
          if [ "$version" != "$zon_version" ]; then
            echo "tag $tag does not match build.zig.zon version $zon_version" >&2
            exit 1
          fi
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture && /^\[[^]]+\]: / { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "no CHANGELOG.md section for $version" >&2
            exit 1
          fi
          echo "release notes for $version:"
          cat release-notes.md

      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"

      # Cross-compile and package each shipped target. The tarball holds the
      # bare `holt` binary at its root, which `holt upgrade` extracts as-is.
      - name: build release assets
        shell: bash
        run: |
          set -euo pipefail
          for entry in "macos aarch64-macos" "macos x86_64-macos" "linux aarch64-linux" "linux x86_64-linux"; do
            set -- $entry
            os="$1"; target="$2"
            arch="${target%%-*}"
            zig build -Dtarget="$target" -Doptimize=safe
            tar -C zig-out/bin -czf "holt-${os}-${arch}.tar.gz" holt
          done
          for target in x86_64-windows aarch64-windows; do
            arch="${target%%-*}"
            zig build -Dtarget="$target" -Doptimize=safe
            (cd zig-out/bin && zip -q "$OLDPWD/holt-windows-${arch}.zip" holt.exe)
          done
          sha256sum holt-*.tar.gz holt-*.zip > SHA256SUMS

      # Created as a draft, so no published release is ever without its assets.
      - name: create the draft release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: true
          fail_on_unmatched_files: true
          files: |
            holt-*.tar.gz
            holt-*.zip
            SHA256SUMS

      # Latest only for the highest version published, so installers that
      # follow Latest never move backwards.
      - name: publish the release
        shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          tag="${GITHUB_REF_NAME}"
          top=$( { gh release list -R "$GITHUB_REPOSITORY" --exclude-drafts --limit 1000 --json tagName --jq '.[].tagName'; echo "$tag"; } | sort -V | tail -1)
          latest=false; [ "$top" = "$tag" ] && latest=true
          gh release edit "$tag" -R "$GITHUB_REPOSITORY" --draft=false --latest="$latest"

  # Installs the release just published, as a user would.
  smoke:
    needs: release
    permissions:
      contents: read
    uses: ./.github/workflows/install-smoke.yml
