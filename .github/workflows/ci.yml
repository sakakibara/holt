name: ci

on:
  push:
    branches: ['ci/**']
  pull_request:
  workflow_dispatch:

permissions: {}

# Cancel any in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.17.0"

jobs:
  # Native build + full test suite on every platform holt ships for.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest          # x86_64-linux
          - ubuntu-24.04-arm       # aarch64-linux
          - macos-latest           # aarch64-macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: install zig
        shell: bash
        run: |
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)    triple=x86_64-linux ;;
            Linux-ARM64)  triple=aarch64-linux ;;
            macOS-ARM64)  triple=aarch64-macos ;;
            *) echo "unsupported runner: ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-${triple}-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-${triple}-${ZIG_VERSION}" >> "$GITHUB_PATH"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-

      - name: format check
        run: zig fmt --check build.zig src bench

      - name: zig build test
        run: zig build test --summary all

      - name: zig build (release)
        run: zig build -Doptimize=safe --summary all

  # Cross-compile every release target from one runner, so a break in any
  # shipped binary is caught before a tag is ever cut.
  cross-compile:
    name: cross (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-macos
          - x86_64-macos
          - aarch64-linux
          - x86_64-linux
          - x86_64-windows
          - aarch64-windows
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-cache-cross-${{ matrix.target }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-cross-${{ matrix.target }}-${{ env.ZIG_VERSION }}-
      - name: build for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=safe

  # Runs the full suite on real Windows; a required gate like the other platforms.
  test-windows:
    name: test (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-windows-${ZIG_VERSION}.zip"
          curl -fsSL "$url" -o zig.zip
          7z x zig.zip -o"$HOME/zig" >/dev/null
          echo "$HOME/zig/zig-x86_64-windows-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-${{ runner.os }}-${{ runner.arch }}-${{ env.ZIG_VERSION }}-
      - name: format check
        shell: bash
        run: zig fmt --check build.zig src bench
      - name: zig build test
        shell: bash
        run: zig build test --summary all

  # Runs the suite under git 2.32, the oldest git kept files support
  # (alpine 3.14 ships 2.32.x), as a non-root user so permission checks hold.
  test-git-min:
    name: test (git 2.32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: install zig
        shell: bash
        run: |
          url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p "$HOME/zig"
          curl -fsSL "$url" | tar -xJ -C "$HOME/zig"
          echo "$HOME/zig/zig-x86_64-linux-${ZIG_VERSION}" >> "$GITHUB_PATH"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .zig-cache
          key: zig-cache-git-min-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-git-min-${{ env.ZIG_VERSION }}-
      - name: build the test binary
        run: zig build test-bin -Dtarget=x86_64-linux-musl
      - name: run it with git 2.32
        run: |
          docker run --rm -v "$PWD/zig-out/bin:/t:ro" alpine:3.14 sh -euc '
            apk add --no-cache git curl tar >/dev/null
            git --version
            adduser -D u
            su u -c "cd /home/u && HOME=/home/u /t/test"
          '

  # install.ps1 can't run end-to-end without a published Windows release, so
  # parse-check it on every push instead.
  install-script:
    name: install.ps1 parse-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: parse-check install.ps1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host 'install.ps1 parses cleanly'

  ci-ok:
    if: always()
    needs: [test, cross-compile, test-windows, test-git-min, install-script]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {actions: read}
    steps:
      - shell: bash
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          set -o pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" --paginate --jq '.jobs[]' \
            | jq -rs '[.[] | select(.name != "ci-ok")] | group_by(.name) | map(max_by(.run_attempt).conclusion) | unique[]' > c
          [ "$(cat c)" = success ] || { echo "jobs ended:"; cat c; exit 1; }
